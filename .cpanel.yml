---
# ----------------------------------------------------------------------
# cPanel Git deployment for the Michael Tourism Sales System (WebVersion)
#
# Server layout:
#
#   $HOME/salestourism.nexabie.co.tz/
#     .envWebVersion              <- create manually once (NOT in Git)
#     .envWebVersion.example      <- copied from this repo
#     app/                        <- private application code
#     public/                     <- subdomain document root
#     database/                   <- schema.sql + seed.sql
#
# In cPanel, point the subdomain document root at:
#   $HOME/salestourism.nexabie.co.tz/public
#
# Confirm the exact document root in cPanel -> Domains. If cPanel shows
# $HOME/public_html/salestourism.nexabie.co.tz, change the two paths below.
#
# The real .envWebVersion is deliberately never copied or overwritten by deployment.
# ----------------------------------------------------------------------
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/salestourism.nexabie.co.tz"
    - export ENVPATH="$HOME/salestourism.nexabie.co.tz"
    - export REPOPATH="$PWD"

    # Fail clearly if the repository root is not this WebVersion folder.
    - /bin/sh -c 'if [ ! -d "$REPOPATH/app" ]; then echo "ERROR - REPOPATH=$REPOPATH does not contain app/. Set REPOPATH in .cpanel.yml."; exit 1; fi'

    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/database"

    # Application code and public web root.
    # If the repository is already checked out at the deploy path, skip the copy.
    - /bin/sh -c 'if [ "$REPOPATH" != "$DEPLOYPATH" ]; then /bin/cp -R "$REPOPATH/app" "$DEPLOYPATH/"; /bin/cp -R "$REPOPATH/public" "$DEPLOYPATH/"; else echo "Repository is already at the deploy path; app/public are in place."; fi'

    # Database schema, demo seed, first-admin helper and upgrade migration
    - /bin/sh -c 'if [ "$REPOPATH" != "$DEPLOYPATH" ]; then /bin/cp "$REPOPATH/database/schema.sql" "$DEPLOYPATH/database/"; /bin/cp "$REPOPATH/database/seed.sql" "$DEPLOYPATH/database/"; /bin/cp "$REPOPATH/database/create_admin.sql" "$DEPLOYPATH/database/"; /bin/cp "$REPOPATH/database/phase1_quotes_travelers.sql" "$DEPLOYPATH/database/"; fi'

    # Documentation and environment template
    - /bin/sh -c 'if [ "$REPOPATH" != "$DEPLOYPATH" ]; then /bin/cp "$REPOPATH/README.md" "$DEPLOYPATH/"; fi'
    - /bin/cp "$REPOPATH/.envWebVersion.example" "$ENVPATH/.envWebVersion.example"

    # Permissions: normal files 644, directories 755, real .envWebVersion 600
    - /bin/find "$DEPLOYPATH/app" "$DEPLOYPATH/public" "$DEPLOYPATH/database" -type f -exec /bin/chmod 644 {} \;
    - /bin/find "$DEPLOYPATH/app" "$DEPLOYPATH/public" "$DEPLOYPATH/database" -type d -exec /bin/chmod 755 {} \;
    - /bin/chmod 644 "$DEPLOYPATH/README.md" 2>/dev/null || true
    - /bin/chmod 644 "$ENVPATH/.envWebVersion.example" 2>/dev/null || true
    - /bin/chmod 600 "$ENVPATH/.envWebVersion" 2>/dev/null || true
